name: Test and Release

on: push

permissions:
  contents: write
  issues: write
  id-token: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  tests-matrix:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version:
          - ">=24.22.1 <25"
          - ">=26.12.1 <27"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check typescript
        run: npx tsc

      - name: Check source code with eslint
        run: npx eslint .

      - name: Check if source code is properly formatted
        run: npx prettier -c ./

      - run: npm test

      - name: Compile
        run: npm run prepublishOnly

  tests:
    runs-on: ubuntu-latest

    needs: [tests-matrix]

    # Stable required status check for the repository rules, independent of
    # the Node.js versions in the matrix.
    if: ${{ always() }}

    steps:
      - name: All tests must have succeeded
        env:
          RESULT: ${{ needs.tests-matrix.result }}
        run: test "$RESULT" = "success"

  release:
    runs-on: ubuntu-24.04

    needs: [tests]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.12.1 <27"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Compile source
        run: npm run prepublishOnly

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The role is set up via https://github.com/bifravst/ci
          # secrets.AWS_ACCOUNT_ID_CI is an organization secret
          role-to-assume: |
            arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_CI }}:role/${{ github.repository_owner }}-ci-${{ github.event.repository.name }}
          # vars.AWS_REGION_CI is an organization variable
          aws-region: ${{ vars.AWS_REGION_CI }}

      - name: Deploy
        env:
          NODE_ARGS: "--no-warnings"
        run: node ./dist/cdk/http-api-mock.js

      - name: End-to-end tests
        env:
          NODE_ARGS: "--no-warnings"
        run: node --test e2e.spec.ts

      - name: Destroy
        env:
          NODE_ARGS: "--no-warnings"
        run: node ./dist/cdk/http-api-mock.js --destroy

      - name: Semantic release
        run: npx semantic-release
